<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gazet in the browser</title>
    <link rel="icon" href="./gazet-logo.svg" />
  </head>
  <body>
    <aside id="panel">
      <header>
        <img src="./gazet-logo.svg" alt="" width="32" height="32" />
        <div>
          <h1>Gazet in the browser</h1>
          <p class="sub">Natural-language geocoding. A 135M model and DuckDB run on this page; geometry comes from Overture's S3 bucket.</p>
        </div>
      </header>

      <form id="form">
        <input id="query" type="text" placeholder="e.g. counties that border Loja" autocomplete="off" disabled />
        <button id="go" type="submit" disabled>Search</button>
      </form>
      <div id="examples"></div>

      <div id="loading">
        <div class="row"><span>Model</span><progress id="model-progress" max="1" value="0"></progress></div>
        <div class="row"><span>Data</span><span id="data-status">waiting</span></div>
      </div>

      <div id="status" role="status"></div>
      <section id="steps"></section>

      <footer>
        <span id="release"></span>
        <a href="https://github.com/developmentseed/gazet">gazet</a>
      </footer>
    </aside>
    <main id="map"></main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
